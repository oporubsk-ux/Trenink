<!DOCTYPE html>
<html lang="cs"><!-- OPFit build 2026-05-12 13:04 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OPFit">
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Trénink">
<title>OPFit</title>
<style>
:root{
  --ca:#2563EB;--ca-l:#DBEAFE;--ca-d:#1D4ED8;
  --cb:#16A34A;--cb-l:#DCFCE7;--cb-d:#15803D;
  --cc:#EA580C;--cc-l:#FFF7ED;--cc-d:#C2410C;
  --cp:#7C3AED;--ce:#0891B2;
  --bg:#F1F5F9;--surf:#FFFFFF;
  --t:#0F172A;--t2:#64748B;--t3:#94A3B8;
  --bd:#E2E8F0;--bd2:#CBD5E1;
  --r:14px;--r2:10px;--tab:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
/* OPFit brand */
.opfit-corner{position:fixed;top:8px;right:10px;z-index:300;pointer-events:none}
.opfit-corner img{width:36px;height:36px;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.2);display:block}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(var(--tab) + var(--safe-b) + 20px);scroll-padding-bottom:calc(var(--tab) + var(--safe-b) + 80px)}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{display:none}

.topbar{position:sticky;top:0;z-index:50;background:var(--surf);border-bottom:1px solid var(--bd);padding:11px 58px 11px 16px;display:flex;align-items:center;gap:10px}
.tb-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-title{font-size:16px;font-weight:700;color:var(--t)}
.tb-sub{font-size:11px;color:var(--t2);margin-top:1px}
.streak{margin-left:auto;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;background:#FEF3C7;color:#92400E;white-space:nowrap}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surf);border-top:1px solid var(--bd);display:flex;padding-bottom:var(--safe-b)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;gap:2px;border:none;background:none;color:var(--t3);font-size:9px;font-weight:600;cursor:pointer;min-height:var(--tab);transition:color .15s}
.tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--act)}
.tab-a{--act:var(--ca)}.tab-b{--act:var(--cb)}.tab-c{--act:var(--cc)}.tab-p{--act:var(--cp)}.tab-e{--act:var(--ce)}.tab-s{--act:#64748B}

.scr{display:none;padding:12px 12px calc(var(--tab) + var(--safe-b) + 24px);animation:fi .18s ease}
.scr.on{display:block}
@keyframes fi{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}

/* CTA */
.btn-new{width:100%;padding:15px;border:none;border-radius:var(--r);font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-bottom:10px;transition:opacity .1s}
.btn-new:active{opacity:.85}
.bta{background:linear-gradient(135deg,#2563EB,#1D4ED8)}
.btb{background:linear-gradient(135deg,#16A34A,#15803D)}
.btc{background:linear-gradient(135deg,#EA580C,#C2410C)}

/* Form */
.form-card{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;margin-bottom:0}
.form-date{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.form-date label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);flex-shrink:0}
.form-date input{flex:1;border:none;background:none;font-size:16px;font-weight:700;color:var(--t);text-align:right;outline:none}
.prev-banner{padding:8px 16px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--t2);background:#F8FAFC}
.ex-blk{border-bottom:1px solid var(--bd)}
.ex-blk:last-child{border-bottom:none}
.ex-hdr{display:flex;align-items:flex-start;gap:9px;padding:12px 14px 5px}
.ex-num{width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;margin-top:1px}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:700;color:var(--t);line-height:1.25}
.ex-reps{font-size:11px;color:var(--t3);margin-top:2px}
.ex-prev{font-size:11px;font-weight:600;margin-top:4px;padding:4px 8px;border-radius:7px;background:rgba(37,99,235,.08)}
.yt-btn{width:32px;height:32px;border:none;background:none;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.yt-btn svg{width:21px;height:21px}
.yt-on{color:#EF4444}.yt-off{color:var(--t3)}
.slabels{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;padding:0 14px 3px}
.slabels span{text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.srow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;padding:0 14px 13px}
.sinp{width:100%;padding:10px 2px;border:1.5px solid var(--bd);border-radius:9px;font-size:18px;font-weight:700;text-align:center;color:var(--t);background:var(--bg);outline:none;transition:border-color .15s;-webkit-appearance:none}
.sinp:focus{border-color:var(--fc)}
.s1i{--fc:var(--ca)}.s2i{--fc:var(--cc)}.s3i{--fc:var(--cp)}
/* FIXED: sticky save bar sits above tab bar */
.form-acts{padding:6px 12px 8px;background:var(--surf);border-top:1px solid var(--bd);border-radius:0 0 var(--r) var(--r);display:grid;grid-template-columns:1fr 2.5fr;gap:7px;position:sticky;bottom:calc(var(--tab) + var(--safe-b));z-index:20;margin-bottom:12px}
.form-scroll-pad{height:90px}
.btn-cancel{border:1.5px solid var(--bd2);border-radius:var(--r2);background:var(--bg);color:var(--t2);font-size:12px;font-weight:600;padding:8px 6px;cursor:pointer}
.btn-save{border:none;border-radius:var(--r2);color:#fff;font-size:13px;font-weight:700;padding:8px 6px;cursor:pointer}
.btn-save:active{opacity:.88}

/* History */
.hist-item{background:var(--surf);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:8px;overflow:hidden}
.hist-top{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer}
.hbadge{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;flex-shrink:0}
.hdate{font-size:14px;font-weight:700;flex:1}
.hmx{font-size:11px;color:var(--t2)}
.hactions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.hbtn{width:30px;height:30px;border:none;background:none;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.hbtn:active{background:var(--bg)}
.hbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.hbody{display:none;border-top:1px solid var(--bd)}
.hbody.op{display:block}
.hex{display:grid;grid-template-columns:18px 1fr auto;gap:4px 8px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--bg)}
.hex:last-child{border-bottom:none}
.hn{font-size:10px;color:var(--t3);text-align:right}
.hnm{font-size:12px;font-weight:500}
.hvl{font-size:11px;color:var(--t2);text-align:right;white-space:nowrap}

/* Empty */
.empty{text-align:center;padding:36px 16px}
.empty-ico{font-size:44px;margin-bottom:12px}
.empty h3{font-size:15px;font-weight:700;margin-bottom:6px}
.empty p{font-size:13px;color:var(--t2);line-height:1.5}

/* Calendar - TABLE based for reliable rendering */
.cal{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.cal-hdr{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.cal-hdr h3{flex:1;font-size:15px;font-weight:700;text-align:center}
.cal-nav{width:32px;height:32px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--t2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-nav:active{background:var(--bd)}
.cal-table{width:100%;border-collapse:collapse;padding:0 8px}
.cal-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--t3);text-align:center;padding:8px 0 4px;width:14.28%}
.cal-table td{text-align:center;padding:3px 2px;width:14.28%}
.cday-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;padding:5px 2px;min-height:40px;transition:background .1s;position:relative}
.cday-inner:hover{background:var(--bg)}
.cday-inner.today .dnum{background:var(--ca);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.cday-inner.sel{background:var(--ca-l)}
.cday-inner.has-sess{background:rgba(37,99,235,.05)}
.dnum{font-size:13px;font-weight:600;color:var(--t);line-height:1.2}
.dnum.other{color:var(--t3)}
.dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin-top:3px}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* Selected day */
.sel-panel{background:var(--bg);border-top:1px solid var(--bd);padding:12px}
.sel-panel h4{font-size:13px;font-weight:700;margin-bottom:9px}
.sel-ex{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--surf);border-radius:var(--r2);margin-bottom:5px;cursor:pointer;border:1px solid var(--bd)}
.sel-ex.exp{border-radius:var(--r2) var(--r2) 0 0;margin-bottom:0}
.sel-ex-num{width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.sel-ex-name{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-ex-max{font-size:14px;font-weight:800;flex-shrink:0}
.sel-chev{width:13px;height:13px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;color:var(--t3);transition:transform .18s}
.sel-chev.op{transform:rotate(180deg)}
.sel-detail{display:none;border:1px solid var(--bd2);border-top:none;border-radius:0 0 var(--r2) var(--r2);padding:9px 11px;margin-bottom:5px;background:var(--surf)}
.sel-detail.op{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:8px;font-size:13px;font-weight:700}
.chip-s1{background:var(--ca-l);color:var(--ca-d)}
.chip-s2{background:var(--cc-l);color:var(--cc-d)}
.chip-s3{background:#EDE9FE;color:#5B21B6}

/* Export button */
.export-btn{width:100%;padding:13px;border:2px dashed var(--bd2);border-radius:var(--r);background:var(--surf);color:var(--t2);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.export-btn:active{background:var(--bg)}

/* Stats */
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat-c{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);padding:12px 8px;text-align:center}
.stat-v{font-size:24px;font-weight:800;line-height:1;margin-bottom:3px}
.stat-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2)}

/* PR */
.pr-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.pr-hdr{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.pr-hdr h3{font-size:13px;font-weight:700;flex:1}
.pr-cnt{font-size:11px;color:var(--t2)}
.pr-row{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--bg)}
.pr-row:last-child{border-bottom:none}
.pr-nm{font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-bar{height:5px;width:60px;background:var(--bg);border-radius:3px;overflow:hidden;flex-shrink:0}
.pr-fill{height:100%;border-radius:3px}
.pr-kg{font-size:14px;font-weight:800;min-width:42px;text-align:right;flex-shrink:0}
.pr-chart{border-top:1px solid var(--bd);background:var(--bg);animation:fi .2s ease}

/* Exercise DB */
.db-item{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.db-hdr{display:flex;align-items:center;gap:9px;padding:11px 14px}
.db-badge{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800}
.db-name{flex:1;font-size:14px;font-weight:600;min-width:0}
.db-reps{font-size:11px;color:var(--t3)}
.db-actions{display:flex;gap:4px;flex-shrink:0}
.db-btn{width:30px;height:30px;border:none;background:none;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.db-btn:active{background:var(--bg)}
.db-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.db-edit-form{border-top:1px solid var(--bd);padding:12px 14px;background:var(--bg)}
.db-edit-form label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--t2);display:block;margin-bottom:4px;margin-top:10px}
.db-edit-form label:first-child{margin-top:0}
.db-inp{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:9px;font-size:14px;color:var(--t);background:var(--surf);outline:none}
.db-inp:focus{border-color:var(--ca)}
.db-sel{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:9px;font-size:14px;color:var(--t);background:var(--surf);outline:none;-webkit-appearance:none}
.db-row{display:flex;gap:8px;margin-top:10px}
.db-save-btn{flex:2;padding:11px;border:none;border-radius:var(--r2);background:var(--ca);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.db-del-btn{flex:1;padding:11px;border:1.5px solid #FCA5A5;border-radius:var(--r2);background:#FEF2F2;color:#DC2626;font-size:13px;font-weight:600;cursor:pointer}

/* Workout plan editor */
.plan-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.plan-hdr{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.plan-hdr h3{font-size:13px;font-weight:700;flex:1}
.plan-slot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--bg);overflow-x:auto;-webkit-overflow-scrolling:touch}
.plan-slot:last-child{border-bottom:none}
.plan-slot-num{font-size:11px;font-weight:700;color:var(--t3);width:16px;flex-shrink:0}
.plan-slot select{flex:1;border:1.5px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--t);background:var(--bg);outline:none;-webkit-appearance:none}

/* Settings */
.install-card{background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:var(--r);padding:16px;color:#fff;margin-bottom:14px}
.install-card h3{font-size:15px;font-weight:800;margin-bottom:6px}
.install-card p{font-size:13px;opacity:.9;line-height:1.5}
.inst-steps{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.inst-step{display:flex;align-items:center;gap:8px;font-size:12px;background:rgba(255,255,255,.15);border-radius:8px;padding:8px 12px}
.inst-step strong{font-size:11px;font-weight:800;background:rgba(255,255,255,.3);border-radius:4px;padding:2px 5px;white-space:nowrap}
.set-group{border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);background:var(--surf)}
.set-row:last-child{border-bottom:none}
.set-label{flex:1;min-width:0}
.set-label strong{font-size:13px;font-weight:600;display:block}
.set-label span{font-size:11px;color:var(--t2)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.sec h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2)}
.sec-btn{font-size:12px;color:var(--ca);font-weight:600;border:none;background:none;cursor:pointer;padding:4px 0}
.tag{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surf);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:600px;padding:20px 16px;padding-bottom:calc(20px + var(--safe-b))}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-inp{width:100%;padding:11px 14px;border:1.5px solid var(--bd);border-radius:var(--r2);font-size:15px;color:var(--t);background:var(--bg);outline:none;margin-bottom:10px;-webkit-appearance:none}
.modal-inp:focus{border-color:var(--ca)}
.modal-row{display:flex;gap:8px;margin-top:4px}
.modal-cancel{flex:1;padding:13px;border:1.5px solid var(--bd2);border-radius:var(--r2);background:var(--bg);color:var(--t2);font-size:14px;font-weight:600;cursor:pointer}
.modal-ok{flex:2;padding:13px;border:none;border-radius:var(--r2);background:var(--ca);color:#fff;font-size:14px;font-weight:700;cursor:pointer}

/* Export canvas overlay */
.export-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.export-overlay canvas{border-radius:12px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.export-close{border:2px solid rgba(255,255,255,.5);border-radius:var(--r);background:rgba(255,255,255,.15);color:#fff;font-size:15px;font-weight:700;padding:12px 24px;cursor:pointer;width:100%;max-width:340px}
.export-save{border:none;border-radius:var(--r);background:#fff;color:#0F172A;font-size:15px;font-weight:700;padding:12px 24px;cursor:pointer;width:100%;max-width:340px}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(var(--tab) + var(--safe-b) + 12px);right:16px;width:52px;height:52px;border-radius:50%;border:none;color:#fff;font-size:26px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:90;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.fab.visible{display:flex}


/* ── Photo gallery ── */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.photo-thumb{position:relative;aspect-ratio:3/4;border-radius:var(--r2);overflow:hidden;cursor:pointer;background:var(--bg);border:1px solid var(--bd)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-date-lbl{position:absolute;bottom:0;left:0;right:0;padding:5px 7px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:10px;font-weight:700}
.photo-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* Before/After slider */
.ba-wrap{position:relative;width:100%;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#111;margin-bottom:12px;cursor:col-resize}
.ba-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba-clip{position:absolute;inset:0;overflow:hidden}
.ba-clip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba-line{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.5);z-index:5;pointer-events:none}
.ba-knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:15px;color:#444;z-index:6;pointer-events:none;white-space:nowrap}
.ba-lbl{position:absolute;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:800;color:#fff;z-index:4;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.ba-lbl-l{bottom:10px;left:10px;background:rgba(0,0,0,.6)}
.ba-lbl-r{bottom:10px;right:10px;background:rgba(37,99,235,.9)}
/* Photo selection */
.photo-thumb.selected{outline:3px solid #7C3AED;outline-offset:-3px}
.photo-thumb.selected::after{content:'✓';position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:#7C3AED;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.select-bar{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.select-bar p{flex:1;font-size:13px;color:var(--t2)}
.select-bar strong{color:#7C3AED}

/* ── Já screen ── */
.ja-figure{position:relative;width:160px;margin:0 auto}
.ja-figure svg{width:160px;height:auto;display:block}
.ja-pin{position:absolute;display:flex;align-items:center;gap:5px;cursor:pointer}
.ja-pin-dot{width:10px;height:10px;border-radius:50%;background:#DB2777;flex-shrink:0;box-shadow:0 0 0 3px rgba(219,39,119,.2)}
.ja-pin-label{font-size:10px;font-weight:700;color:#DB2777;white-space:nowrap;background:#fff;padding:1px 5px;border-radius:4px;border:1px solid #FBC7DF}
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.meas-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r2);padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.meas-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2)}
.meas-val{font-size:22px;font-weight:800;color:var(--t);line-height:1}
.meas-unit{font-size:11px;color:var(--t3);font-weight:500}
.meas-delta{font-size:11px;font-weight:600}
.meas-inp-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.meas-inp-row:last-child{border-bottom:none}
.meas-inp-row label{font-size:13px;font-weight:600;flex:1}
.meas-inp{width:80px;padding:7px 10px;border:1.5px solid var(--bd);border-radius:8px;font-size:15px;font-weight:700;text-align:right;color:var(--t);background:var(--bg);outline:none}
.meas-inp:focus{border-color:#DB2777}
.chart-wrap{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.chart-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--bd)}
.chart-hdr h3{font-size:13px;font-weight:700}
.chart-tabs{display:flex;gap:4px}
.chart-tab{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1.5px solid var(--bd);background:var(--bg);color:var(--t2);cursor:pointer}
.chart-tab.on{background:#DB2777;color:#fff;border-color:#DB2777}
.chart-svg{padding:0 8px 12px;overflow:hidden}
</style>
</head>

// STORAGE
// ═══════════════════════════════════════════════════════
function LS(k,d){
  try{
    let v=localStorage.getItem(k);
    if(v==null) v=localStorage.getItem('bak_'+k); // try backup
    return v!=null?JSON.parse(v):d;
  }catch{return d;}
}
function SS(k,v){
  try{
    const s=JSON.stringify(v);
    localStorage.setItem(k,s);
    // backup copy
    localStorage.setItem('bak_'+k,s);
  }catch(e){alert('Chyba uložení: '+e.message);}
}

let sessions   = LS('trn_sessions',[]);
let exerciseDB = LS('trn_exdb', DEFAULT_EXERCISES);
let workoutPlan= LS('trn_plan', DEFAULT_PLAN);

// ensure all default exercises exist in DB (for upgrades)
DEFAULT_EXERCISES.forEach(de=>{if(!exerciseDB.find(e=>e.id===de.id)){exerciseDB.push(de);}});

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function today(){return new Date().toISOString().slice(0,10);}
function fmt(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return`${d}.${m}.${y}`;}
function histT(t){return sessions.filter(s=>s.type===t).sort((a,b)=>b.date.localeCompare(a.date));}
function mxS(s){return Math.max(0,...Object.values(s.exercises).flatMap(e=>[parseFloat(e.s1kg)||0,parseFloat(e.s2kg)||0,parseFloat(e.s3kg)||0]));}
function lastSess(t){return histT(t)[0]||null;}
function lastSessForNotes(t){return histT(t)[0]||null;}
function getEx(id){return exerciseDB.find(e=>e.id===id)||null;}
function normalizePlan(t){
  workoutPlan[t]=(workoutPlan[t]||[]).map(e=>typeof e==='string'?{id:e,s:2}:e);
}
function getPlanEx(t){normalizePlan(t);return workoutPlan[t].map(e=>({...getEx(e.id),_series:e.s||2})).filter(e=>e.id);}
function getPlanSlots(t){normalizePlan(t);return workoutPlan[t];}
function streak(){
  if(!sessions.length)return 0;
  const dates=[...new Set(sessions.map(s=>s.date))].sort((a,b)=>b.localeCompare(a));
  let n=1;for(let i=1;i<dates.length;i++){if((new Date(dates[i-1])-new Date(dates[i]))/864e5<=4)n++;else break;}
  return n;
}
function updateTopbar(t){

  const m=meta[t]||meta.S;
  document.getElementById('tb-title').textContent=m.title;
  const icon=document.getElementById('tb-icon');
  icon.style.background=m.ibg;icon.querySelector('svg').setAttribute('stroke',m.is);
  const str=streak(),sel=document.getElementById('streak-el');
  if(str>=2){sel.textContent=`🔥 ${str} v řadě`;sel.style.display='';}else sel.style.display='none';
}

let formT=null, editId=null, openH={}, cur='A';

function buildSeriesInputs(ex,pd,isEdit,t,i,w){
  const ns=ex._series||2;
  const colors=[w.color,w.dark,'#7C3AED'];
  const cls=['s1i','s2i','s3i'];
  const cols=(('1fr 1fr ').repeat(ns)).trim();
  let lh='<div class="slabels" style="grid-template-columns:'+cols+'">',rh='<div class="srow" style="grid-template-columns:'+cols+'">';
  for(let si=0;si<ns;si++){
    const sn='s'+(si+1)+'kg',sr='s'+(si+1)+'rep';
    const pvk=pd[sn]||'',pvr=pd[sr]||'';
    const vk=isEdit&&pvk?pvk:'';
    const vr=isEdit&&pvr?pvr:'';
    const phk=(!isEdit&&pvk)?pvk:'kg';
    const phr=(!isEdit&&pvr)?pvr:'—';
    const dc=colors[si]||w.color;
    const sc=cls[si]||'s1i';
    lh+='<span style="color:'+dc+'">S'+(si+1)+' váha</span><span style="color:'+dc+'">S'+(si+1)+' opak.</span>';
    rh+='<input class="sinp '+sc+'" type="number" inputmode="decimal" placeholder="'+phk+'" value="'+vk+'" id="s'+(si+1)+'k-'+t+'-'+i+'">'
       +'<input class="sinp '+sc+'" type="number" inputmode="numeric" placeholder="'+phr+'" value="'+vr+'" id="s'+(si+1)+'r-'+t+'-'+i+'">';
  }
  // Goal buttons row
  let gh='<div style="display:flex;align-items:center;gap:8px;padding:4px 14px 12px">'
    +'<span style="font-size:10px;color:var(--t3);font-weight:600">Cíl příště:</span>'
    +'<button id="goal-V-'+t+'-'+i+'" onclick="setSeriesGoal(\''+t+'\','+i+',\'V\')" style="padding:5px 14px;border:none;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;border-bottom:3px solid #DC2626;background:var(--bg);color:#DC2626;transition:all .15s">⬆ Váha</button>'
    +'<button id="goal-O-'+t+'-'+i+'" onclick="setSeriesGoal(\''+t+'\','+i+',\'O\')" style="padding:5px 14px;border:none;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;border-bottom:3px solid #16A34A;background:var(--bg);color:#16A34A;transition:all .15s">⬆ Opak.</button>'
    +'</div>';
  // Apply current goal state from seriesGoals
  return lh+'</div>'+rh+'</div>'+gh;
}

        : '';

        ? ((!isEdit&&(pd.s1rep||pd.s2rep)) ? 'Minule — '+[pd.s1rep?'S1: '+fmtSecs(parseInt(pd.s1rep)||0):null,pd.s2rep?'S2: '+fmtSecs(parseInt(pd.s2rep)||0):null].filter(Boolean).join('  ·  ') : null)
        : ((!isEdit && pd.s1kg) ? `Minule — S1: ${pd.s1kg}kg × ${pd.s1rep||'?'}${pd.s2kg?`  ·  S2: ${pd.s2kg}kg × ${pd.s2rep||'?'}`:''}` : null);

      const v1r = isEdit&&pd.s1rep ? pd.s1rep : '';
      const v2k = isEdit&&pd.s2kg ? pd.s2kg : '';
      const v2r = isEdit&&pd.s2rep ? pd.s2rep : '';
      const ph1k = (!isEdit&&pd.s1kg) ? pd.s1kg : 'kg';
      const ph1r = (!isEdit&&pd.s1rep) ? pd.s1rep : '—';
      const ph2k = (!isEdit&&pd.s2kg) ? pd.s2kg : 'kg';

        </div>

    </div>`;

      Nový trénink ${t}
    </button>`;

      h+=`<div class="empty"><div class="empty-ico">🏋️</div><h3>Zatím žádné tréninky</h3><p>Přidej první trénink tlačítkem výše.</p></div>`;
    } else {
      h+=`<div class="sec"><h2>Historie</h2><span style="font-size:11px;color:var(--t2)">${hist.length} sesí</span></div>`;
      hist.forEach(s=>{
        const m=mxS(s),op=openH[s.id];
        h+=`<div class="hist-item">
          <div class="hist-top" onclick="togH('${s.id}','${t}')">
            <span class="hbadge" style="background:${w.light};color:${w.dark}">${t}</span>
            <span class="hdate">${fmt(s.date)}</span>
            ${(()=>{
              const plankE=Object.entries(s.exercises).find(([nm,v])=>nm==='PLANK');
              const plankMax=plankE?Math.max(parseInt(plankE[1].s1rep)||0,parseInt(plankE[1].s2rep)||0):0;
              const dispMax=m>0?m+' kg max':plankMax>0?fmtSecs(plankMax)+' plank':'';
              return dispMax||s.duration?`<span class="hmx">${dispMax}${s.duration?' · '+s.duration+' min':''}</span>`:'';
            })()}
            <div class="hactions" onclick="event.stopPropagation()">
              ${s.goals&&Object.keys(s.goals).length?`<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:${Object.values(s.goals).includes('V')?'#FEE2E2':'#DCFCE7'};color:${Object.values(s.goals).includes('V')?'#DC2626':'#16A34A'}">${Object.values(s.goals).includes('V')?'⬆ Váha':'⬆ Opak.'}</span>`:''}
              <button class="hbtn" onclick="editSess('${s.id}','${t}')" title="Upravit">${editSVG}</button>
              <button class="hbtn" onclick="delS('${s.id}','${t}')" title="Smazat">${trashSVG}</button>
            </div>
            <svg class="hchev ${op?'op':''}" style="fill:none;stroke:var(--t3);stroke-width:2;stroke-linecap:round;transition:transform .18s;${op?'transform:rotate(180deg)':''}" viewBox="0 0 24 24" width="16" height="16"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="hbody ${op?'op':''}">`;
        exercises.forEach((ex,i)=>{
          const d=s.exercises[ex.name]||{};
          if(!d.s1kg&&!d.s2kg)return;
          const isPlank=ex.name==='PLANK';
          const ns=ex._series||2;
          const pts=isPlank
            ?[...Array(ns)].map((_,si)=>{const r=d['s'+(si+1)+'rep'];return r?'S'+(si+1)+': '+fmtSecs(parseInt(r)||0):null;}).filter(Boolean).join('  ·  ')||'—'
            :[...Array(ns)].map((_,si)=>{const k=d['s'+(si+1)+'kg'],r=d['s'+(si+1)+'rep'];return k?k+'kg×'+(r||'?'):null;}).filter(Boolean).join(' · ');
          // note now from session object
          const isPlankH=ex.name==='PLANK';
          // series rendered inline below
          const exGoal = s.goals&&s.goals[ex.name];
          const exGoalBadge = exGoal==='V'
            ? `<span style="font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:#FEE2E2;color:#DC2626;border-bottom:1.5px solid #DC2626;margin-left:4px;flex-shrink:0">⬆V</span>`
            : exGoal==='O'
            ? `<span style="font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:#DCFCE7;color:#16A34A;border-bottom:1.5px solid #16A34A;margin-left:4px;flex-shrink:0">⬆O</span>`
            : '';
          // All series on ONE line
          let seriesLine='';
          if(isPlankH){
            const plankParts=[];
            ['s1rep','s2rep','s3rep'].forEach((k,si)=>{
              const v=parseInt(d[k])||0;
              if(v>0) plankParts.push('<span style="font-size:10px;font-weight:700;color:var(--t)">S'+(si+1)+': '+fmtSecs(v)+'</span>');
            });
            seriesLine=plankParts.join('<span style="color:var(--bd2);margin:0 4px">·</span>');
          } else {
            const parts=[];
            ['s1','s2','s3'].forEach((sn,si)=>{
              const kg=d[sn+'kg'],rep=d[sn+'rep'];
              if(kg) parts.push('<span style="font-size:10px;font-weight:700;color:var(--t)">S'+(si+1)+': '+kg+'kg×'+(rep||'?')+'</span>');
            });

          }
          h+=`<div style="padding:5px 14px 4px;border-bottom:1px solid var(--bg)">
            <div style="display:flex;align-items:center;gap:4px">
              <span style="font-size:10px;font-weight:700;color:var(--t3);width:14px;text-align:right;flex-shrink:0">${i+1}</span>
              <span style="font-size:12px;font-weight:600;color:var(--t);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ex.name}</span>
              ${exGoalBadge}
            </div>
            ${seriesLine?`<div style="padding:2px 0 1px 18px;font-size:11px;color:var(--t2)">${seriesLine}</div>`:''}
          </div>`;
          const sessNote=s.notes&&s.notes[ex.name];
          if(sessNote) h+=`<div style="padding:1px 14px 4px 28px;font-size:11px;color:var(--t3)">📝 ${sessNote}</div>`;
        });
        h+=`</div></div>`;
      });
    }
  }
  el.innerHTML=h;
}

function openF(t){formT=t;editId=null;renderW(t);}
function editSess(id,t){
  formT=t;editId=id;
  // Restore goals from the session being edited
  const s=sessions.find(x=>x.id===id);
  seriesGoals={};
  if(s&&s.goals){
    const exs=getPlanEx(t);
    exs.forEach((ex,i)=>{
      if(s.goals[ex.name]) seriesGoals[t+'-'+i]=s.goals[ex.name];
    });
  }
  renderW(t);
  // Re-apply goal button highlights after render
  setTimeout(()=>applyGoalHighlights(t),50);
}
function cancelF(){formT=null;editId=null;seriesGoals={};exNotes={};renderW(cur);}
function saveF(t){
  const exercises=getPlanEx(t);
  const date=document.getElementById('fd-'+t)?.value||today();
  const dur=document.getElementById('fd-dur-'+t)?.value||'';
  const ex={};
  const goals_map={};
  const notes_map={};
  exercises.forEach((e,i)=>{
    const ns=e._series||2;
    const d={};
    for(let si=1;si<=ns;si++){
      d['s'+si+'kg']=document.getElementById('s'+si+'k-'+t+'-'+i)?.value||'';
      d['s'+si+'rep']=document.getElementById('s'+si+'r-'+t+'-'+i)?.value||'';
    }
    ex[e.name]=d;
    const gk=t+'-'+i;
    if(seriesGoals[gk]) goals_map[e.name]=seriesGoals[gk];
    const note=document.getElementById('ex-note-'+t+'-'+i)?.value||'';
    if(note) notes_map[e.name]=note;
  });
  // CRITICAL: always reload fresh from localStorage before writing
  // This prevents any in-memory state issues from wiping existing sessions
  sessions = LS('trn_sessions',[]);
  if(editId){
    sessions=sessions.map(s=>s.id===editId?{...s,date,duration:dur,exercises:ex,goals:goals_map,notes:notes_map}:s);
  } else {
    sessions.unshift({id:Date.now().toString(),type:t,date,duration:dur,exercises:ex,goals:goals_map,notes:notes_map});
  }
  SS('trn_sessions',sessions);
  formT=null;editId=null;seriesGoals={};exNotes={};renderW(t);updateTopbar(t);
}
function togH(id,t){openH[id]=!openH[id];if(t==='J')renderJ();else renderW(t);}
function delS(id,t){if(!confirm('Smazat tento záznam?'))return;sessions=sessions.filter(s=>s.id!==id);SS('trn_sessions',sessions);renderW(t);}

let calY=new Date().getFullYear(),calM=new Date().getMonth(),calSel=null,calSelEx=null,prOpenKey=null;

function renderP(){
  const el=document.getElementById('scr-P');
  const tot=sessions.length;
  const best=sessions.reduce((b,s)=>{const m=mxS(s);return m>(b?mxS(b):0)?s:b;},null);
  let h=`<div class="stat-row">
    <div class="stat-c"><div class="stat-v" style="color:var(--ca)">${tot}</div><div class="stat-l">Celkem sesí</div></div>
    <div class="stat-c"><div class="stat-v" style="font-size:18px;color:var(--t)">${['A','B','C'].map(t=>sessions.filter(s=>s.type===t).length).join('·')}</div><div class="stat-l">A · B · C</div></div>
    <div class="stat-c"><div class="stat-v" style="color:var(--cb)">${best?mxS(best):0}<small style="font-size:13px">kg</small></div><div class="stat-l">Rekord</div></div>
  </div>
  <div class="stat-row" style="grid-template-columns:1fr 1fr;margin-top:-4px">
    <div class="stat-c">
      <div class="stat-v" style="color:var(--cp)">${(()=>{const d=sessions.filter(s=>s.duration&&parseInt(s.duration)>0);return d.length?Math.round(d.reduce((a,s)=>a+parseInt(s.duration),0)/d.length):0;})()}<small style="font-size:14px"> min</small></div>
      <div class="stat-l">Průměrný čas</div>
    </div>
    <div class="stat-c">
      <div class="stat-v" style="color:var(--t2)">${(()=>{const last=sessions.sort((a,b)=>b.date.localeCompare(a.date))[0];return last?fmt(last.date):'—';})()}</div>
      <div class="stat-l">Poslední trénink</div>
    </div>
  </div>`;
  h+=buildCal();
  if(calSel) h+=buildSelPanel();
  h+=`<button class="export-btn" onclick="showExportPicker()">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    Exportovat trénink jako obrázek
  </button>`;
  h+=`<div class="sec"><h2>Osobní rekordy</h2></div>`;
  ['A','B','C'].forEach(t=>{
    const w=WO_META[t],ss=histT(t),exs=getPlanEx(t);
    h+=`<div class="pr-card"><div class="pr-hdr"><div class="tag" style="background:${w.color}">${t}</div><h3>Trénink ${t}</h3><span class="pr-cnt">${ss.length} sesí</span></div>`;
    if(!ss.length){h+=`<div style="padding:11px 14px;font-size:12px;color:var(--t3)">Zatím žádná data</div>`;}
    else{
      const prs=exs.map(ex=>{
      const isP=ex.name==='PLANK';
      const vals=ss.map(s=>{const e=s.exercises[ex.name]||{};
        return isP?Math.max(parseInt(e.s1rep)||0,parseInt(e.s2rep)||0,parseInt(e.s3rep)||0):Math.max(parseFloat(e.s1kg)||0,parseFloat(e.s2kg)||0,parseFloat(e.s3kg)||0);
      }).filter(v=>v>0);
      return{name:ex.name,pr:Math.max(0,...vals,0),isPlank:isP};});
      const mx2=Math.max(...prs.map(p=>p.pr),1);
      prs.forEach(p=>{
        const key=t+':'+p.name;
        const isOpen=prOpenKey===key;
        const chartPts=ss.filter(s=>s.exercises[p.name]).map(s=>{
          const e=s.exercises[p.name]||{};
          let v,reps;
          if(p.isPlank){
            v=Math.max(parseInt(e.s1rep)||0,parseInt(e.s2rep)||0,parseInt(e.s3rep)||0);
          } else {
            // find best series (highest weight)
            let bestKg=0,bestRep=0;
            ['s1','s2','s3'].forEach(sn=>{const kg=parseFloat(e[sn+'kg'])||0;if(kg>bestKg){bestKg=kg;bestRep=parseInt(e[sn+'rep'])||0;}});
            v=bestKg;reps=bestRep||0;
          }
          const goal=s.goals&&s.goals[p.name]?s.goals[p.name]:null;
          return{date:s.date,v,reps,goal};
        }).filter(x=>x.v>0).sort((a,b)=>a.date.localeCompare(b.date));
        // Compute stagnation: if prev goal was V/O but value didn't increase
        const goalPts=chartPts.map((pt,i)=>{
          if(i===0) return pt.goal;
          const prev=chartPts[i-1];
          const prevGoal=prev.goal;
          if(!prevGoal) return null;
          if(prevGoal==='V' && pt.v>prev.v) return 'V';
          if(prevGoal==='O' && pt.reps>prev.reps) return 'O';
          if(prevGoal && pt.v<=prev.v && pt.reps<=prev.reps) return 'stag';
          return prevGoal;
        });
        h+=`<div>
          <div class="pr-row" style="cursor:pointer" onclick="togglePrChart('${key}')">
            <span class="pr-nm">${p.name}</span>
            <svg style="width:13px;height:13px;flex-shrink:0;fill:none;stroke:var(--t3);stroke-width:2;stroke-linecap:round;transition:transform .18s;${isOpen?'transform:rotate(180deg)':''}" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            <div class="pr-bar" style="width:50px"><div class="pr-fill" style="width:${p.pr>0?Math.round(p.pr/mx2*100):0}%;background:${w.color}"></div></div>
            <span class="pr-kg" style="color:${w.color}">${p.pr>0?(p.isPlank?fmtSecs(p.pr):p.pr+' kg'):'—'}</span>
          </div>
          ${isOpen?buildPrChart(chartPts,w.color,p.isPlank,goalPts):''}
        </div>`;
      });
    }
    h+=`</div>`;
  });
  el.innerHTML=h;
}

function buildCal(){
  const MN=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  const DOW=['Po','Út','St','Čt','Pá','So','Ne'];
  const y=calY,m=calM;
  // Use UTC to avoid timezone issues
  const firstDow = new Date(y,m,1).getDay(); // 0=Sun..6=Sat
  const off = (firstDow===0)?6:firstDow-1;   // Mon-based offset
  const dim = new Date(y,m+1,0).getDate();
  const td=today();
  const dmap={};
  sessions.forEach(s=>{if(!dmap[s.date])dmap[s.date]=[];dmap[s.date].push(s);});

  let h=`<div class="cal">
    <div class="cal-hdr">
      <button class="cal-nav" onclick="calNav(-1)">‹</button>
      <h3>${MN[m]} ${y}</h3>
      <button class="cal-nav" onclick="calNav(1)">›</button>
    </div>
    <table class="cal-table" style="width:100%;border-collapse:collapse;padding:0 8px">
      <thead><tr>`;
  DOW.forEach(d=>h+=`<th>${d}</th>`);
  h+=`</tr></thead><tbody><tr>`;

  let col=0;
  // empty leading cells
  for(let i=0;i<off;i++){h+=`<td></td>`;col++;}
  for(let d=1;d<=dim;d++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ds=dmap[iso]||[];
    const isT=iso===td,isSel=iso===calSel;
    h+=`<td><div class="cday-inner${isT?' today':''}${isSel?' sel':''}${ds.length?' has-sess':''}" onclick="selDay('${iso}')">
      <span class="dnum">${d}</span>`;
    if(ds.length)h+=`<div class="dots">${ds.map(s=>`<span class="dot" style="background:${WO_META[s.type].color}"></span>`).join('')}</div>`;
    h+=`</div></td>`;
    col++;
    if(col%7===0 && d<dim) h+=`</tr><tr>`;
  }
  // trailing cells
  const trail=7-(col%7);
  if(trail<7)for(let i=0;i<trail;i++)h+=`<td></td>`;
  h+=`</tr></tbody></table></div>`;
  return h;
}

function buildSelPanel(){
  const ss=sessions.filter(s=>s.date===calSel);
  if(!ss.length)return`<div style="background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center;color:var(--t2);font-size:13px;margin-bottom:12px">Žádný trénink pro ${fmt(calSel)}</div>`;
  let h='';
  ss.forEach(s=>{
    const w=WO_META[s.type];
    const exs=getPlanEx(s.type);
    h+=`<div class="sel-panel"><h4>🗓 ${fmt(s.date)} — Trénink ${s.type}${s.duration?' · ⏱ '+s.duration+' min':''}</h4>`;
    exs.forEach((ex,i)=>{
      const d=s.exercises[ex.name]||{};
      const isPlank=ex.name==='PLANK';
      const s1=isPlank?(parseInt(d.s1rep)||0):parseFloat(d.s1kg)||0;
      const s2=isPlank?(parseInt(d.s2rep)||0):parseFloat(d.s2kg)||0;
      const mx=isPlank?Math.max(s1,s2):Math.max(s1,s2);
      if(!d.s1kg&&!d.s2kg&&!d.s1rep)return;
      // Always show all series expanded
      const serChips=[];
      if(isPlank){
        ['s1rep','s2rep','s3rep'].forEach((k,si)=>{if(d[k])serChips.push('S'+(si+1)+': '+fmtSecs(parseInt(d[k])||0));});
      } else {
        ['s1','s2','s3'].forEach((sn,si)=>{if(d[sn+'kg'])serChips.push('S'+(si+1)+': '+d[sn+'kg']+'kg×'+(d[sn+'rep']||'?'));});
      }
      const selGoal=s.goals&&s.goals[ex.name];
      const selGoalBadge=selGoal==='V'
        ?'<span style="font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:#FEE2E2;color:#DC2626;border-bottom:1.5px solid #DC2626;flex-shrink:0">⬆V</span>'
        :selGoal==='O'
        ?'<span style="font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:#DCFCE7;color:#16A34A;border-bottom:1.5px solid #16A34A;flex-shrink:0">⬆O</span>'
        :'';
      h+='<div style="border:1px solid var(--bd);border-radius:var(--r2);margin-bottom:6px;overflow:hidden;background:var(--surf)">'
        +'<div style="display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:'+(serChips.length?'1px solid var(--bd)':'none')+'">'
        +'<div class="sel-ex-num" style="background:'+w.color+'">'+(i+1)+'</div>'
        +'<span style="flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+ex.name+'</span>'
        +selGoalBadge
        +'<span style="font-size:13px;font-weight:800;color:'+w.color+';flex-shrink:0;margin-left:4px">'+(isPlank?(Math.max(parseInt(d.s1rep)||0,parseInt(d.s2rep)||0,parseInt(d.s3rep)||0)>0?fmtSecs(Math.max(parseInt(d.s1rep)||0,parseInt(d.s2rep)||0,parseInt(d.s3rep)||0)):'—'):(mx>0?mx+' kg':'—'))+'</span>'
        +'</div>'
        +(serChips.length?'<div style="padding:5px 12px 6px;font-size:11px;color:var(--t2)">'+serChips.join(' · ')+'</div>':'')
        +'</div>'
    });
    h+=`</div>`;
  });
  return h;
}

function calNav(d){calM+=d;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}calSel=null;calSelEx=null;renderP();}
function selDay(iso){calSel=calSel===iso?null:iso;calSelEx=null;renderP();}
function togSE(sid,idx){const k=`${sid}-${idx}`;calSelEx=calSelEx===k?null:k;renderP();}

let exportOverlay=null;

function showExportPicker(){
  // Pick the most recent session to export, or let user pick from calendar
  if(!sessions.length){alert('Zatím žádné záznamy k exportu.');return;}
  const sorted=[...sessions].sort((a,b)=>b.date.localeCompare(a.date));
  const opts=sorted.slice(0,10).map((s,i)=>`<option value="${s.id}">${fmt(s.date)} — Trénink ${s.type}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend',`
    <div class="modal-overlay" id="exp-picker" onclick="if(event.target.id==='exp-picker')closeExpPicker()">
      <div class="modal">
        <h3>📤 Export tréninku</h3>
        <p style="font-size:13px;color:var(--t2);margin-bottom:12px">Vyber trénink, který chceš sdílet s trenérem:</p>
        <select class="modal-inp" id="exp-sel">${opts}</select>
        <div class="modal-row">
          <button class="modal-cancel" onclick="closeExpPicker()">Zrušit</button>
          <button class="modal-ok" onclick="doExport()">Exportovat →</button>
        </div>
      </div>
    </div>`);
}
function closeExpPicker(){document.getElementById('exp-picker')?.remove();}
function doExport(){
  const id=document.getElementById('exp-sel')?.value;
  closeExpPicker();
  const s=sessions.find(x=>x.id===id);
  if(!s)return;
  renderExportCanvas(s);
}

function renderExportCanvas(s){
  const w=WO_META[s.type];
  const exs=getPlanEx(s.type);
  const dpr=window.devicePixelRatio||2;
  const CW=360,pad=20;
  // Collect rows
  const rows=[];
  exs.forEach((ex,i)=>{
    const d=s.exercises[ex.name]||{};
    if(!d.s1kg&&!d.s2kg)return;
    rows.push({num:i+1,name:ex.name,s1:`${d.s1kg||'—'}kg×${d.s1rep||'—'}`,s2:`${d.s2kg||'—'}kg×${d.s2rep||'—'}`,mx:Math.max(parseFloat(d.s1kg)||0,parseFloat(d.s2kg)||0)});
  });
  const rowH=52,headerH=100,footerH=44;
  const CH=headerH+rows.length*rowH+footerH+pad;
  const can=document.createElement('canvas');
  can.width=CW*dpr;can.height=CH*dpr;
  can.style.width=CW+'px';can.style.height=CH+'px';
  const ctx=can.getContext('2d');
  ctx.scale(dpr,dpr);
  // Background
  ctx.fillStyle='#F1F5F9';ctx.fillRect(0,0,CW,CH);
  // Header card
  rRect(ctx,0,0,CW,headerH,0);
  ctx.fillStyle=w.color;ctx.fillRect(0,0,CW,headerH);
  // Gradient overlay
  const grd=ctx.createLinearGradient(0,0,CW,headerH);
  grd.addColorStop(0,'rgba(0,0,0,.15)');grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,CW,headerH);
  // Type badge
  ctx.fillStyle='rgba(255,255,255,.25)';rRect(ctx,pad,pad,44,44,10);
  ctx.fillStyle='#fff';ctx.font=`bold ${22}px -apple-system,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(s.type,pad+22,pad+22);
  // Title
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.font=`bold 20px -apple-system,sans-serif`;
  ctx.fillText(`Trénink ${s.type}`,pad+54,pad+18);
  ctx.font=`15px -apple-system,sans-serif`;ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText(fmt(s.date),pad+54,pad+40);
  const mx2=Math.max(...rows.map(r=>r.mx),0);
  ctx.font=`bold 28px -apple-system,sans-serif`;ctx.fillStyle='#fff';ctx.textAlign='right';
  ctx.fillText(mx2>0?`${mx2} kg`:'',CW-pad,pad+28);
  ctx.font=`11px -apple-system,sans-serif`;ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.fillText('MAX VÁHA',CW-pad,pad+50);
  // Rows
  rows.forEach((r,i)=>{
    const ry=headerH+i*rowH+6;
    ctx.fillStyle=i%2===0?'#FFFFFF':'#F8FAFC';
    ctx.fillRect(0,ry,CW,rowH-2);
    // num bubble
    ctx.fillStyle=w.color+'22';rRect(ctx,pad,ry+10,26,26,7);
    ctx.fillStyle=w.color;ctx.font=`bold 12px -apple-system,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(r.num,pad+13,ry+23);
    // name
    ctx.textAlign='left';ctx.fillStyle='#0F172A';ctx.font=`600 13px -apple-system,sans-serif`;
    const nm=r.name.length>28?r.name.slice(0,27)+'…':r.name;
    ctx.fillText(nm,pad+34,ry+16);
    // values
    ctx.font=`12px -apple-system,sans-serif`;ctx.fillStyle='#64748B';
    ctx.fillText(`S1: ${r.s1}   S2: ${r.s2}`,pad+34,ry+34);
    // max badge
    if(r.mx>0){
      ctx.fillStyle=w.color;ctx.textAlign='right';ctx.font=`bold 14px -apple-system,sans-serif`;
      ctx.fillText(`${r.mx} kg`,CW-pad,ry+23);
    }
  });
  // Footer
  const fy=headerH+rows.length*rowH+8;
  ctx.fillStyle='#E2E8F0';ctx.fillRect(0,fy,CW,1);
  ctx.fillStyle='#94A3B8';ctx.font=`11px -apple-system,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Tréninkový deník – Ondřej Porubský',CW/2,fy+18);

  // Show overlay
  if(exportOverlay)exportOverlay.remove();
  const ov=document.createElement('div');
  ov.className='export-overlay';
  ov.id='exp-overlay';
  ov.innerHTML=`<div style="text-align:center;color:#fff;font-size:13px;margin-bottom:4px">Náhled pro trenéra</div>`;
  ov.appendChild(can);
  const dlBtn=document.createElement('button');
  dlBtn.className='export-save';
  dlBtn.textContent='💾 Stáhnout jako PNG';
  dlBtn.onclick=()=>{const a=document.createElement('a');a.href=can.toDataURL('image/png');a.download=`trening-${s.type}-${s.date}.png`;a.click();};
  const clBtn=document.createElement('button');
  clBtn.className='export-close';clBtn.textContent='Zavřít';clBtn.onclick=()=>ov.remove();
  ov.appendChild(dlBtn);ov.appendChild(clBtn);
  document.body.appendChild(ov);
  exportOverlay=ov;
}
function rRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();}

function exportData(){
  // Export sessions + photos
  getAllPhotos().then(photos=>{
    // Compress photos: reduce to max 400px and quality 0.5 for export
    const compressedPromises = photos.map(p => new Promise(res=>{
      const img = new Image();
      img.onload = () => {
        const maxW=400, maxH=600;
        let w=img.width, h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res({id:p.id, date:p.date, category:p.category||'front', dataUrl:c.toDataURL('image/jpeg',0.5)});
      };
      img.onerror=()=>res({id:p.id,date:p.date,category:p.category||'front',dataUrl:p.dataUrl});
      img.src=p.dataUrl;
    }));
    Promise.all(compressedPromises).then(compPhotos=>{
      const data={sessions,exerciseDB,workoutPlan,jaMeasurements,jaGoals,photos:compPhotos};
      const b=new Blob([JSON.stringify(data)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='trening-zaloha-'+today()+'.json';
      a.click();
      alert('Exportováno: '+sessions.length+' tréninků, '+compPhotos.length+' fotek');
    });
  }).catch(()=>{
    // Fallback without photos
    const data={sessions,exerciseDB,workoutPlan,jaMeasurements,jaGoals};
    const b=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='trening-zaloha-'+today()+'.json';
    a.click();
  });
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.sessions){sessions=d.sessions;SS('trn_sessions',sessions);}
      if(d.exerciseDB){exerciseDB=d.exerciseDB;SS('trn_exdb',exerciseDB);}
      if(d.workoutPlan){workoutPlan=d.workoutPlan;SS('trn_plan',workoutPlan);}
      if(d.jaMeasurements){jaMeasurements=d.jaMeasurements;SS('trn_meas',jaMeasurements);}
      if(d.jaGoals){jaGoals=d.jaGoals;SS('trn_goals',jaGoals);}
      const photos=d.photos||[];
      if(photos.length>0){
        ensureDB().then(db=>{
          const tx=db.transaction('photos','readwrite');
          const store=tx.objectStore('photos');
          photos.forEach(p=>{
            const rec={date:p.date,dataUrl:p.dataUrl,category:p.category||'front'};
            if(p.id) rec.id=p.id;
            store.put(rec);
          });
          tx.oncomplete=()=>{
            alert('Importováno: '+sessions.length+' tréninků, '+photos.length+' fotek, '+jaMeasurements.length+' měření');
            loadAndRenderF();
            go(cur);
          };
        });
      } else {
        alert('Importováno: '+sessions.length+' tréninků, '+jaMeasurements.length+' měření');
        go(cur);
      }
    }catch(err){alert('Chybný soubor: '+err.message);}
  };
  r.readAsText(f);
}

function renderJ(){
  const el = document.getElementById('scr-J');
  // For each field, find the most recent entry that has a value for it
  const sorted_meas = [...jaMeasurements].sort((a,b)=>b.date.localeCompare(a.date));
  function lastValFor(fieldId){
    const entry = sorted_meas.find(m=>m[fieldId]!=null&&m[fieldId]!=='');
    return entry ? entry : null;
  }
  function lastValPrevFor(fieldId){
    const entries = sorted_meas.filter(m=>m[fieldId]!=null&&m[fieldId]!=='');
    return entries.length > 1 ? entries[1] : null;
  }
  const last = jaMeasurements.length ? jaMeasurements[jaMeasurements.length-1] : null;
  const prev = jaMeasurements.length > 1 ? jaMeasurements[jaMeasurements.length-2] : null;
  // For display: use per-field last values
  const lastWeight = lastValFor('weight');
  const prevWeight = lastValPrevFor('weight');

  // Stats row – weight + last date

function buildPrChart(pts,color,isPlank,goalPts){
  if(!pts||pts.length<2) return `<div class="pr-chart" style="padding:12px 14px 10px;font-size:12px;color:var(--t3);text-align:center">Potřeba alespoň 2 záznamy pro graf</div>`;
  const W=300,H=130,pL=42,pR=36,pT=12,pB=28;
  const iW=W-pL-pR,iH=H-pT-pB;

  // Weight axis (left)
  const wVals=pts.map(p=>p.v);
  const minW=Math.min(...wVals),maxW=Math.max(...wVals);
  const wRange=maxW-minW||1;
  const xs=pts.map((_,i)=>pL+i/(pts.length-1)*iW);
  const ys=pts.map(p=>pT+iH-(p.v-minW)/wRange*iH);
  const wPath=xs.map((x,i)=>(i?'L':'M')+x.toFixed(1)+','+ys[i].toFixed(1)).join(' ');
  const wArea=wPath+' L'+xs[xs.length-1].toFixed(1)+','+(pT+iH)+' L'+xs[0].toFixed(1)+','+(pT+iH)+' Z';

  // Reps axis (right) — only for non-plank
  const hasReps=!isPlank&&pts.some(p=>p.reps>0);
  const rVals=hasReps?pts.map(p=>p.reps||0):[];
  const minR=hasReps?Math.min(...rVals.filter(r=>r>0)):0;
  const maxR=hasReps?Math.max(...rVals):0;
  const rRange=maxR-minR||1;
  const rys=hasReps?pts.map(p=>p.reps>0?pT+iH-(p.reps-minR)/rRange*iH:null):[];
  const rPts=hasReps?pts.map((p,i)=>p.reps>0?{x:xs[i],y:rys[i]}:null).filter(Boolean):[];
  const rPath=rPts.length>1?rPts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '):'';

  // Y axis labels left (weight) — 5 nice steps
  let yLabels='';
  const ySteps=5;
  // Round step size to nice number
  const rawStep=(maxW-minW)/(ySteps-1)||1;
  const magnitude=Math.pow(10,Math.floor(Math.log10(rawStep)));
  const niceStep=Math.ceil(rawStep/magnitude)*magnitude;
  const niceMin=Math.floor(minW/niceStep)*niceStep;
  for(let yi=0;yi<ySteps;yi++){
    const v=niceMin+yi*niceStep;
    if(v>maxW+niceStep) break;
    const y=pT+iH-(v-minW)/wRange*iH;
    if(y<pT-4||y>pT+iH+4) continue;
    const lbl=isPlank?fmtSecs(Math.round(v)):Math.round(v*10)/10;
    yLabels+=`<line x1="${pL}" y1="${y.toFixed(1)}" x2="${W-pR}" y2="${y.toFixed(1)}" stroke="#E2E8F0" stroke-width="0.7"/>`;
    yLabels+=`<text x="${pL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="7.5" fill="${color}">${lbl}</text>`;
  }
  // Y axis labels right (reps) — 3 steps
  let rLabels='';
  if(hasReps&&maxR>0){
    const rSteps=3;
    for(let ri=0;ri<rSteps;ri++){
      const v=Math.round(minR+(maxR-minR)*ri/(rSteps-1));
      const y=pT+iH-ri*(iH/(rSteps-1));
      rLabels+=`<text x="${W-pR+4}" y="${(y+3.5).toFixed(1)}" text-anchor="start" font-size="7.5" fill="#94A3B8">${v}</text>`;
    }
    // Right axis title
    rLabels+=`<text x="${W-2}" y="${pT+iH/2}" text-anchor="middle" font-size="7" fill="#94A3B8" transform="rotate(90,${W-2},${pT+iH/2})">opak.</text>`;
  }

  // X labels
  const xShow=pts.length<=4?pts.map((_,i)=>i):[0,Math.floor((pts.length-1)/2),pts.length-1];
  let xLabels='';
  xShow.forEach(i=>{
    const d=pts[i].date.slice(5).replace('-','.');
    xLabels+=`<text x="${xs[i].toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7.5" fill="#94A3B8">${d}</text>`;
  });

  // Dots
  const dots=pts.map((p,i)=>{
    const gp=goalPts&&goalPts[i];
    const dc=gp==='V'?'#DC2626':gp==='O'?'#16A34A':gp==='stag'?'#7C3AED':color;
    const repsTxt=(!isPlank&&p.reps)?` × ${p.reps} opak.`:'';
    return `<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="${dc}" stroke="white" stroke-width="1.5"><title>${fmt(p.date)}: ${isPlank?fmtSecs(p.v):p.v+' kg'}${repsTxt}</title></circle>`;
  }).join('');

  // Reps line dots
  const repsDots=hasReps?pts.map((p,i)=>p.reps>0?`<circle cx="${xs[i].toFixed(1)}" cy="${rys[i].toFixed(1)}" r="2.5" fill="#94A3B8" stroke="white" stroke-width="1" opacity="0.8"><title>${fmt(p.date)}: ${p.reps} opak.</title></circle>`:'').join(''):'';

  // Trend
  const first=pts[0].v,last=pts[pts.length-1].v;
  const trend=last-first;
  const trendTxt=trend>0?`▲ +${isPlank?fmtSecs(Math.round(trend)):Math.round(trend*10)/10}`:trend<0?`▼ ${isPlank?fmtSecs(Math.round(trend)):Math.round(trend*10)/10}`:'→ beze změny';
  const trendColor=trend>0?'#16A34A':trend<0?'#EA580C':'#64748B';
  const repsVals=pts.map(p=>p.reps||0).filter(r=>r>0);
  const lastReps=repsVals[repsVals.length-1]||0;
  const firstReps=repsVals[0]||0;
  const repsTrend=lastReps-firstReps;
  const repsLine=(!isPlank&&lastReps>0)?`<span style="font-size:10px;color:#94A3B8;margin-left:8px">opak: ${lastReps}${repsTrend!==0?` (${repsTrend>0?'+':''}${repsTrend})`:''}</span>`:'';

  return `<div class="pr-chart">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 14px 2px;flex-wrap:wrap;gap:2px">
      <span style="font-size:10px;font-weight:600;color:var(--t3)">${pts.length} tréninků${repsLine}</span>
      <span style="font-size:11px;font-weight:700;color:${trendColor}">${trendTxt}</span>
    </div>
    <div style="padding:0 4px 8px;overflow:hidden">
      <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${H}px;display:block;overflow:visible">
        <defs>
          <linearGradient id="prg${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity=".2"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${yLabels}${rLabels}
        <path d="${wArea}" fill="url(#prg${color.replace('#','')})"/>
        <path d="${wPath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${hasReps&&rPath?`<path d="${rPath}" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>`:'' }
        ${dots}${repsDots}
        ${xLabels}
      </svg>
      ${hasReps?`<div style="display:flex;gap:12px;justify-content:center;padding:2px 0;font-size:9px;color:var(--t3)">
        <span>─── <span style="color:${color}">●</span> váha (kg)</span>
        <span>- - - <span style="color:#94A3B8">●</span> opakování</span>
      </div>`:''}
    </div>
  </div>`;
}

function buildMeasChart(){
  const sorted=[...jaMeasurements].sort((a,b)=>a.date.localeCompare(b.date));
  if(sorted.length<2) return `<div style="background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:20px;text-align:center;color:var(--t3);font-size:13px;margin-bottom:10px">Graf bude dostupný od 2. měření</div>`;

  const f=MEAS_FIELDS.find(x=>x.id===jaChartField)||MEAS_FIELDS[0];
  const pts=sorted.filter(m=>m[f.id]).map(m=>({date:fmt(m.date),v:parseFloat(m[f.id])}));
  if(pts.length<2) return '';

  const W=320,H=130,padL=36,padR=12,padT=10,padB=28;
  const iW=W-padL-padR,iH=H-padT-padB;
  const vals=pts.map(p=>p.v);
  const minV=Math.min(...vals),maxV=Math.max(...vals);
  const range=maxV-minV||1;
  const xs=pts.map((_,i)=>padL+i/(pts.length-1)*iW);
  const ys=pts.map(p=>padT+iH-(p.v-minV)/range*iH);

  // path
  const path=xs.map((x,i)=>`${i?'L':'M'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const area=path+` L${xs[xs.length-1].toFixed(1)},${(padT+iH).toFixed(1)} L${xs[0].toFixed(1)},${(padT+iH).toFixed(1)} Z`;

  // y axis labels
  const yLabels=[minV, minV+(maxV-minV)/2, maxV].map((v,i)=>({v:Math.round(v*10)/10, y:padT+iH-i*(iH/2)}));
  // x labels – show first, last, maybe middle
  const xShow=pts.length<=4?pts.map((_,i)=>i):[0,Math.floor(pts.length/2),pts.length-1];

  let chartTabs=MEAS_FIELDS.map(mf=>`<button class="chart-tab ${jaChartField===mf.id?'on':''}" onclick="setChartField('${mf.id}')" style="${jaChartField===mf.id?'background:'+mf.color+';border-color:'+mf.color:''}">${mf.label.replace('Obvod ','')}</button>`).join('');

  return `<div class="chart-wrap">
    <div class="chart-hdr">
      <h3>${f.label}</h3>
      <div style="font-size:14px;font-weight:800;color:${f.color}">${pts[pts.length-1].v} ${f.unit}</div>
    </div>
    <div style="padding:8px 14px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--bd)">
      <div style="display:inline-flex;gap:5px;flex-wrap:nowrap">${chartTabs}</div>
    </div>
    <div class="chart-svg">
      <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${H}px;overflow:visible">
        <defs>
          <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${f.color}" stop-opacity=".2"/>
            <stop offset="100%" stop-color="${f.color}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${yLabels.map(l=>`<line x1="${padL}" y1="${l.y.toFixed(1)}" x2="${W-padR}" y2="${l.y.toFixed(1)}" stroke="var(--bd)" stroke-width="0.5"/>
          <text x="${padL-4}" y="${(l.y+4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--t3)">${l.v}</text>`).join('')}
        <path d="${area}" fill="url(#cg)"/>
        <path d="${path}" fill="none" stroke="${f.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map((p,i)=>`<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="${f.color}" stroke="white" stroke-width="1.5"/>`).join('')}
        ${xShow.map(i=>`<text x="${xs[i].toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--t3)">${pts[i].date}</text>`).join('')}
      </svg>
    </div>
  </div>`;
}

// PHOTOS — IndexedDB storage
// ═══════════════════════════════════════════════════════
let photoDB = null;
let baPercent = 50;
let baDragging = false;
let photoCache = [];
let fPhotoCat = 'front';
let selMode = false;
let selIds = [];
let baLeftId = null;
let baRightId = null;

const PHOTO_CATS = [
  {id:'front', label:'Zepředu', emoji:'🔵', color:'#2563EB'},
  {id:'back',  label:'Zezadu',  emoji:'🟢', color:'#16A34A'},
  {id:'side',  label:'Z boku',  emoji:'🟠', color:'#EA580C'},
];

function openPhotoDB(){
  return new Promise((res,rej)=>{
    if(photoDB){res(photoDB);return;}
    const req = indexedDB.open('trening-photos-v2', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('photos')){
        const store = db.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
        store.createIndex('date','date',{unique:false});
      }
    };
    req.onsuccess = e => { photoDB = e.target.result; res(photoDB); };
    req.onerror = e => {
      console.error('IndexedDB error:', e.target.error);
      rej(e.target.error);
    };
    req.onblocked = () => {
      console.warn('IndexedDB blocked');
    };
  });
}

function ensureDB(){
  return photoDB ? Promise.resolve(photoDB) : openPhotoDB();
}

function getAllPhotos(){
  return ensureDB().then(db => new Promise((res,rej)=>{
    const tx = db.transaction('photos','readonly');
    const req = tx.objectStore('photos').getAll();
    req.onsuccess = () => res(req.result||[]);
    req.onerror = e => rej(e.target.error);
  }));
}

function savePhoto(date, dataUrl, category){
  category = category||'front';
  return ensureDB().then(db => new Promise((res,rej)=>{
    const tx = db.transaction('photos','readwrite');
    const record = {date:date, dataUrl:dataUrl, category:category};
    const req = tx.objectStore('photos').add(record);
    req.onsuccess = e => { res(e.target.result); };
    req.onerror = e => {
      console.error('savePhoto error:', e.target.error);
      rej(e.target.error);
    };
    tx.onerror = e => {
      console.error('tx error:', e.target.error);
      rej(e.target.error);
    };
  }));
}

function deletePhoto(id){
  return ensureDB().then(db => new Promise((res,rej)=>{
    const tx = db.transaction('photos','readwrite');
    const req = tx.objectStore('photos').delete(Number(id));
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  }));
}

function addPhoto(inp){
  const file = inp.files[0];
  if(!file) return;
  inp.value='';
  document.body.insertAdjacentHTML('beforeend',`
    <div class="modal-overlay" id="cat-modal">
      <div class="modal">
        <h3>📸 Přidat fotku</h3>
        <div style="margin-bottom:12px">
          <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);display:block;margin-bottom:6px">Datum pořízení</label>
          <input type="date" id="photo-date-inp" value="${today()}" style="width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:var(--r2);font-size:15px;font-weight:600;color:var(--t);background:var(--bg);outline:none">
        </div>
        <p style="font-size:13px;color:var(--t2);margin-bottom:10px">Kategorie:</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button onclick="finishAddPhoto(window._pendingFile,'front')" style="padding:13px;border:none;border-radius:var(--r2);background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;font-size:15px;font-weight:700;cursor:pointer">🔵 Zepředu</button>
          <button onclick="finishAddPhoto(window._pendingFile,'back')" style="padding:13px;border:none;border-radius:var(--r2);background:linear-gradient(135deg,#16A34A,#15803D);color:#fff;font-size:15px;font-weight:700;cursor:pointer">🟢 Zezadu</button>
          <button onclick="finishAddPhoto(window._pendingFile,'side')" style="padding:13px;border:none;border-radius:var(--r2);background:linear-gradient(135deg,#EA580C,#C2410C);color:#fff;font-size:15px;font-weight:700;cursor:pointer">🟠 Z boku</button>
        </div>
        <button onclick="document.getElementById('cat-modal').remove()" style="width:100%;margin-top:10px;padding:11px;border:1.5px solid var(--bd2);border-radius:var(--r2);background:var(--bg);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer">Zrušit</button>
      </div>
    </div>`);
  window._pendingFile = file;
}

function finishAddPhoto(file, category){
  const date = document.getElementById('photo-date-inp')?.value || today();
  document.getElementById('cat-modal')?.remove();
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW=800,maxH=1200;
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/jpeg',0.82);
      savePhoto(date,dataUrl,category)
        .then(()=>{ loadAndRenderF(); })
        .catch(err=>{ alert('Chyba uložení fotky: '+(err&&err.message||err)); });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function deletePhotoAndRefresh(id){
  if(!confirm('Smazat tuto fotku?')) return;
  if(baLeftId===id) baLeftId=null;
  if(baRightId===id) baRightId=null;
  selIds = selIds.filter(x=>x!==id);
  deletePhoto(id).then(()=>loadAndRenderF());
}

function loadAndRenderF(){
  getAllPhotos().then(photos=>{
    photoCache = photos.sort((a,b)=>a.date.localeCompare(b.date));
    // Reset BA to default (first+last of current cat) if custom selection is invalid
    const catPhotos = photoCache.filter(p=>(p.category||'front')===fPhotoCat);
    if(catPhotos.length>=2){
      const l=catPhotos[0], r=catPhotos[catPhotos.length-1];
      if(!baLeftId || !catPhotos.find(p=>p.id===baLeftId)) baLeftId=l.id;
      if(!baRightId || !catPhotos.find(p=>p.id===baRightId)) baRightId=r.id;
      if(baLeftId===baRightId) baRightId=r.id;
    }
    renderF();
  });
}

// ── Thumbnail click: selection mode vs lightbox ───────────────────────
function thumbClick(id){
  if(selMode){
    if(selIds.includes(id)){
      selIds = selIds.filter(x=>x!==id);
    } else if(selIds.length < 2){
      selIds.push(id);
    } else {
      // replace oldest selection
      selIds.shift();
      selIds.push(id);
    }
    renderF();
  } else {
    showLightbox(id);
  }
}

function toggleSelMode(){
  selMode = !selMode;
  if(!selMode) selIds=[];
  renderF();
}

function applySelection(){
  if(selIds.length===2){
    const catPhotos = photoCache.filter(p=>(p.category||'front')===fPhotoCat);
    const a = catPhotos.find(p=>p.id===selIds[0]);
    const b = catPhotos.find(p=>p.id===selIds[1]);
    if(a&&b){
      // Put older one on left, newer on right
      if(a.date <= b.date){ baLeftId=a.id; baRightId=b.id; }
      else { baLeftId=b.id; baRightId=a.id; }
    }
  }
  selMode=false; selIds=[]; baPercent=50;
  renderF();
}

function renderF(){
  const el = document.getElementById('scr-F');
  if(!el) return;
  const photos = photoCache;
  const cat = PHOTO_CATS.find(c=>c.id===fPhotoCat)||PHOTO_CATS[0];
  const catPhotos = photos.filter(p=>(p.category||'front')===fPhotoCat).sort((a,b)=>a.date.localeCompare(b.date));

  let h = '';

  // Category tabs
  h += '<div style="display:flex;gap:5px;margin-bottom:12px;background:var(--surf);padding:5px;border-radius:var(--r);border:1px solid var(--bd)">';
  PHOTO_CATS.forEach(c=>{
    const cnt=photos.filter(p=>(p.category||'front')===c.id).length;
    const on=c.id===fPhotoCat;
    h+='<button onclick="setFCat(\''+c.id+'\')" style="flex:1;padding:8px 4px;border:none;border-radius:var(--r2);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;background:'+(on?c.color:'transparent')+';color:'+(on?'#fff':'var(--t2)')+'">'+c.emoji+' '+c.label+'<br><span style="font-size:10px;opacity:.75">'+cnt+' fotek</span></button>';
  });
  h += '</div>';

  // Before/After slider — show selected pair or default first/last
  const baA = selIds.length>=1 ? catPhotos.find(p=>p.id==selIds[0]) : catPhotos[0];
  const baB = selIds.length>=2 ? catPhotos.find(p=>p.id==selIds[1]) : catPhotos[catPhotos.length-1];
  const canBA = catPhotos.length>=2 && baA && baB && baA.id!==baB.id;

  if(canBA){
    const older = baA.date<=baB.date ? baA : baB;
    const newer = baA.date<=baB.date ? baB : baA;
    h += '<div class="sec"><h2>Porovnání</h2>'
      +(selMode?'<button onclick="cancelSel()" style="font-size:12px;color:#DC2626;font-weight:600;border:none;background:none;cursor:pointer">Zrušit výběr</button>'
               :'<button onclick="startSel()" style="font-size:12px;color:var(--ca);font-weight:600;border:none;background:none;cursor:pointer">Vybrat jiné</button>')
      +'</div>';
    h += '<div class="ba-wrap" id="ba-wrap"'
      +' ontouchstart="baStart(event)" ontouchmove="baMove(event)" ontouchend="baDone()"'
      +' onmousedown="baStart(event)" onmousemove="baMove(event)" onmouseup="baDone()" onmouseleave="baDone()">'
      // After (newer) = right side, always full width
      +'<img class="ba-img" src="'+newer.dataUrl+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">'
      // Before (older) = left side, clipped
      +'<div class="ba-clip" id="ba-clip" style="position:absolute;inset:0;overflow:hidden;width:'+baPercent+'%">'
      +'<img src="'+older.dataUrl+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center">'
      +'</div>'
      // Divider line
      +'<div class="ba-line" id="ba-line" style="position:absolute;top:0;bottom:0;left:'+baPercent+'%;transform:translateX(-50%);width:3px;background:#fff;box-shadow:0 0 10px rgba(0,0,0,.4);z-index:5">'
      +'<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:13px;color:#555;white-space:nowrap;font-weight:700">◀▶</div>'
      +'</div>'
      +'<span class="ba-lbl ba-lbl-l">'+fmt(older.date)+'</span>'
      +'<span class="ba-lbl ba-lbl-r">'+fmt(newer.date)+'</span>'
      +'</div>';
  } else if(catPhotos.length===1){
    h += '<div style="background:var(--surf);border:1px dashed var(--bd2);border-radius:var(--r);padding:14px;text-align:center;color:var(--t2);font-size:13px;margin-bottom:12px">Přidej druhou fotku '+cat.emoji+' pro porovnání</div>';
  }

  // Gallery
  h += '<div class="sec"><h2>Galerie — '+cat.label+'</h2>'
      +(selMode?'<span style="font-size:11px;color:var(--ca);font-weight:600">Klikni na 2 fotky k porovnání</span>':'<span style="font-size:11px;color:var(--t2)">'+catPhotos.length+' fotek</span>')
      +'</div>';

  if(!catPhotos.length){
    h += '<div class="empty"><div class="empty-ico">'+cat.emoji+'</div><h3>Žádné fotky '+cat.label+'</h3><p>Přidej první fotku tlačítkem + vpravo dole.</p></div>';
  } else {
    h += '<div class="photo-grid">';
    [...catPhotos].reverse().forEach(p=>{
      const isSel = selIds.includes(p.id);
      const selOrder = selIds.indexOf(p.id);
      h += '<div class="photo-thumb" onclick="'+(selMode?'toggleSel('+p.id+')':'showLightbox('+p.id+')')+'" style="outline:'+(isSel?'3px solid '+(selOrder===0?'#2563EB':'#EA580C'):'none')+';outline-offset:-3px">'
          +'<img src="'+p.dataUrl+'" loading="lazy">'
          +(isSel?'<div style="position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:'+(selOrder===0?'#2563EB':'#EA580C')+';color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center">'+(selOrder+1)+'</div>':'')
          +'<div class="photo-date-lbl">'+fmt(p.date)+'</div>'
          +(selMode?'':'<button class="photo-del" onclick="event.stopPropagation();photoMenu('+p.id+')">⋮</button>')
          +'</div>';
    });
    h += '</div>';
  }

  el.innerHTML = h;
  if(!selMode){ baPercent=50; }
  updateBA();
}

function setFCat(cat){ fPhotoCat=cat; selIds=[]; selMode=false; baPercent=50; renderF(); }
function startSel(){ selMode=true; selIds=[]; renderF(); }
function cancelSel(){ selMode=false; selIds=[]; renderF(); }
function toggleSel(id){
  const idx=selIds.indexOf(id);
  if(idx>=0){ selIds.splice(idx,1); }
  else if(selIds.length<2){ selIds.push(id); }
  if(selIds.length===2){ selMode=false; baPercent=50; }
  renderF();
}


// ── Before/After drag ─────────────────────────────────────────────────
function getWrapX(e,wrap){
  const rect=wrap.getBoundingClientRect();
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  return Math.max(2,Math.min(98,(cx-rect.left)/rect.width*100));
}
function baStart(e){
  baDragging=true;
  const w=document.getElementById('ba-wrap');
  if(w){baPercent=getWrapX(e,w);updateBA();}
  e.preventDefault();
}
function baMove(e){
  if(!baDragging)return;
  const w=document.getElementById('ba-wrap');
  if(w){baPercent=getWrapX(e,w);updateBA();}
  e.preventDefault();
}
function baDone(){baDragging=false;}
function updateBA(){
  const clip=document.getElementById('ba-clip');
  const line=document.getElementById('ba-line');
  if(clip)clip.style.width=baPercent+'%';
  if(line)line.style.left=baPercent+'%';
}

// ── Lightbox ──────────────────────────────────────────────────────────
function showLightbox(id){
  const p=photoCache.find(x=>x.id==id);
  if(!p)return;
  document.body.insertAdjacentHTML('beforeend',`
    <div class="lightbox" id="lightbox" onclick="if(event.target.id==='lightbox')closeLightbox()">
      <button class="lightbox-close" onclick="closeLightbox()">✕</button>
      <img src="${p.dataUrl}" draggable="false">
      <div class="lightbox-date">${fmt(p.date)}</div>
    </div>`);
}
function closeLightbox(){document.getElementById('lightbox')?.remove();}

function closeModal(id){document.getElementById(id)?.remove();}
function photoMenu(id){
  const p=photoCache.find(x=>x.id==id);if(!p)return;
  const div=document.createElement('div');
  div.className='modal-overlay';div.id='pmenu-modal';
  div.onclick=e=>{if(e.target===div)div.remove();};
  div.innerHTML='<div class="modal"><h3>📸 Fotka — '+fmt(p.date)+'</h3>'
    +'<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">'
    +'<button id="pm-date" style="padding:13px;border:1.5px solid var(--bd2);border-radius:var(--r2);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;text-align:left">📅 Změnit datum</button>'
    +'<button id="pm-view" style="padding:13px;border:1.5px solid var(--bd2);border-radius:var(--r2);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;text-align:left">🔍 Zobrazit celou</button>'
    +'<button id="pm-del" style="padding:13px;border:1.5px solid #FCA5A5;border-radius:var(--r2);background:#FEF2F2;color:#DC2626;font-size:14px;font-weight:600;cursor:pointer;text-align:left">🗑 Smazat</button>'
    +'</div><button id="pm-close" style="width:100%;margin-top:10px;padding:11px;border:1.5px solid var(--bd2);border-radius:var(--r2);background:var(--bg);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer">Zavřít</button></div>';
  document.body.appendChild(div);
  document.getElementById('pm-date').onclick=()=>editPhotoDate(id);
  document.getElementById('pm-view').onclick=()=>{div.remove();showLightbox(id);};
  document.getElementById('pm-del').onclick=()=>{div.remove();deletePhotoAndRefresh(id);};
  document.getElementById('pm-close').onclick=()=>div.remove();
}

function editPhotoDate(id){
  document.getElementById('pmenu-modal')?.remove();
  const p=photoCache.find(x=>x.id==id);if(!p)return;
  const div=document.createElement('div');
  div.className='modal-overlay';div.id='edate-modal';
  div.onclick=e=>{if(e.target===div)div.remove();};
  div.innerHTML='<div class="modal"><h3>📅 Datum fotky</h3>'
    +'<input type="date" id="edate-inp" class="modal-inp" value="'+p.date+'">'
    +'<div class="modal-row">'
    +'<button id="ed-cancel" class="modal-cancel">Zrušit</button>'
    +'<button id="ed-ok" class="modal-ok">Uložit</button>'
    +'</div></div>';
  document.body.appendChild(div);
  document.getElementById('ed-cancel').onclick=()=>div.remove();
  document.getElementById('ed-ok').onclick=()=>savePhotoDate(id);
}

function savePhotoDate(id){
  const nd=document.getElementById('edate-inp')?.value;
  document.getElementById('edate-modal')?.remove();
  if(!nd||!photoDB)return;
  const tx=photoDB.transaction('photos','readwrite');
  const store=tx.objectStore('photos');
  const req=store.get(id);
  req.onsuccess=()=>{const rec=req.result;if(!rec)return;rec.date=nd;store.put(rec);tx.oncomplete=()=>loadAndRenderF();};
}
