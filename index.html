const plankTimers={};

function fmtSecs(s){
  const m=Math.floor(s/60),sec=s%60;
  return m+':'+(sec<10?'0':'')+sec;
}

function plankPlay(t,i,rid){
  const key=t+'-'+i+'-'+rid;
  if(plankTimers[key]) return;
  const disp=document.getElementById('plank-display-'+t+'-'+i+'-'+rid);
  const playBtn=document.getElementById('plank-play-'+t+'-'+i+'-'+rid);
  const inp=document.getElementById(rid+'-'+t+'-'+i);
  let secs=parseInt(inp?.value)||0;
  const origBg=rid==='s1r'?'var(--ca)':'#EA580C';
  if(playBtn){playBtn.style.background='#15803D';playBtn.textContent='⏸';}
  plankTimers[key]=setInterval(()=>{
    secs++;
    if(disp) disp.textContent=fmtSecs(secs);
    if(inp) inp.value=secs;
  },1000);
  if(playBtn) playBtn.onclick=()=>plankPause(t,i,rid);
}

function plankPause(t,i,rid){
  const key=t+'-'+i+'-'+rid;
  clearInterval(plankTimers[key]);
  delete plankTimers[key];
  const playBtn=document.getElementById('plank-play-'+t+'-'+i+'-'+rid);
  const origBg=rid==='s1r'?'var(--ca)':'#EA580C';
  if(playBtn){playBtn.style.background=origBg;playBtn.textContent='▶';playBtn.onclick=()=>plankPlay(t,i,rid);}
}

function plankStop(t,i,rid){
  plankPause(t,i,rid);
}

function plankReset(t,i,rid){
  plankPause(t,i,rid);
  const disp=document.getElementById('plank-display-'+t+'-'+i+'-'+rid);
  const inp=document.getElementById(rid+'-'+t+'-'+i);
  if(disp) disp.textContent='0:00';
  if(inp) inp.value='';
}

function setSeriesGoal(t,i,goal){
  const key=t+'-'+i;
  seriesGoals[key] = seriesGoals[key]===goal ? null : goal;
  const btnV=document.getElementById('goal-V-'+t+'-'+i);
  const btnO=document.getElementById('goal-O-'+t+'-'+i);
  if(btnV) btnV.style.background = seriesGoals[key]==='V'?'#FEE2E2':'var(--bg)';
  if(btnO) btnO.style.background = seriesGoals[key]==='O'?'#DCFCE7':'var(--bg)';
}

function toggleExChart(t, i){
  const key=t+'-'+i;
  openExChart[key]=!openExChart[key];
  renderW(t);
  // Scroll to chart after render
  if(openExChart[key]){
    setTimeout(()=>{
      const el=document.getElementById('mini-chart-'+t+'-'+i);
      if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
    },100);
  }
}

function buildMiniExChart(exName, t, color){
  const ss=histT(t).filter(s=>s.exercises[exName]);
  const isPlank=exName==='PLANK';
  const pts=ss.map(s=>{
    const e=s.exercises[exName]||{};
    let v,reps,goal;
    if(isPlank){
      v=Math.max(parseInt(e.s1rep)||0,parseInt(e.s2rep)||0,parseInt(e.s3rep)||0);
      reps=v;
    } else {
      let bestKg=0,bestRep=0;
      ['s1','s2','s3'].forEach(sn=>{const kg=parseFloat(e[sn+'kg'])||0;if(kg>bestKg){bestKg=kg;bestRep=parseInt(e[sn+'rep'])||0;}});
      v=bestKg;reps=bestRep;
    }
    goal=s.goals&&s.goals[exName]?s.goals[exName]:null;
    return{date:s.date,v,reps,goal};
  }).filter(x=>x.v>0).sort((a,b)=>a.date.localeCompare(b.date));

  if(pts.length<1) return '<div id="mini-chart-'+t+'-0" style="padding:10px 14px;font-size:12px;color:var(--t3);text-align:center">Zatím žádná data</div>';
  if(pts.length<2) return '<div id="mini-chart-'+t+'-0" style="padding:6px 14px 10px;font-size:12px;color:var(--t3);text-align:center">Potřeba alespoň 2 záznamy (máš '+pts.length+')</div>';

  const W=300,H=110,pL=36,pR=32,pT=10,pB=22;
  const iW=W-pL-pR,iH=H-pT-pB;

  // Weight (left Y)
  const wVals=pts.map(p=>p.v);
  const minW=Math.min(...wVals),maxW=Math.max(...wVals);
  const wRange=maxW-minW||1;
  const xs=pts.map((_,i)=>pL+i/(pts.length-1)*iW);
  const ys=pts.map(p=>pT+iH-(p.v-minW)/wRange*iH);
  const wPath=xs.map((x,i)=>(i?'L':'M')+x.toFixed(1)+','+ys[i].toFixed(1)).join(' ');
  const wArea=wPath+' L'+xs[xs.length-1].toFixed(1)+','+(pT+iH)+' L'+xs[0].toFixed(1)+','+(pT+iH)+' Z';

  // Reps (right Y)
  const hasReps=!isPlank&&pts.some(p=>p.reps>0);
  const rVals=hasReps?pts.map(p=>p.reps||0):[];
  const minR=hasReps?Math.min(...rVals.filter(r=>r>0)):0;
  const maxR=hasReps?Math.max(...rVals):0;
  const rRange=maxR-minR||1;
  const rys=hasReps?pts.map(p=>p.reps>0?pT+iH-(p.reps-minR)/rRange*iH:null):[];
  const rPts=hasReps?pts.map((p,i)=>p.reps>0?{x:xs[i],y:rys[i]}:null).filter(Boolean):[];
  const rPath=rPts.length>1?rPts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '):'';

  // Y labels — 3 steps for weight, 2 for reps
  let yLbls='';
  const mSteps=3;
  for(let yi=0;yi<mSteps;yi++){
    const v=minW+(maxW-minW)*yi/(mSteps-1);
    const y=pT+iH-yi*(iH/(mSteps-1));
    const lbl=isPlank?fmtSecs(Math.round(v)):Math.round(v*10)/10;
    yLbls+=`<line x1="${pL}" y1="${y.toFixed(1)}" x2="${W-pR}" y2="${y.toFixed(1)}" stroke="#E2E8F0" stroke-width="0.6"/>`;
    yLbls+=`<text x="${pL-3}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="7.5" fill="${color}">${lbl}</text>`;
  }
  if(hasReps&&maxR>0){
    [minR,Math.round((minR+maxR)/2),maxR].forEach((v,yi)=>{
      const y=pT+iH-yi*(iH/2);
      yLbls+=`<text x="${W-pR+4}" y="${(y+3).toFixed(1)}" text-anchor="start" font-size="7.5" fill="#94A3B8">${v}</text>`;
    });
  }

  // X labels
  const xShow=pts.length<=3?pts.map((_,i)=>i):[0,pts.length-1];
  let xLbls='';
  xShow.forEach(i=>{
    xLbls+=`<text x="${xs[i].toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="7.5" fill="#94A3B8">${pts[i].date.slice(5).replace('-','.')}</text>`;
  });

  // Weight dots — RED if goal was V (want to increase weight), else color
  const wDots=pts.map((p,i)=>{
    const dc=p.goal==='V'?'#DC2626':color;
    const lbl=isPlank?fmtSecs(p.v):p.v+'kg'+(p.reps?' ×'+p.reps:'');
    return `<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="${dc}" stroke="white" stroke-width="1.5"><title>${fmt(p.date)}: ${lbl}</title></circle>`;
  }).join('');

  // Reps dots — GREEN if goal was O (want to increase reps), else gray
  const rDots=hasReps?pts.map((p,i)=>p.reps>0?`<circle cx="${xs[i].toFixed(1)}" cy="${rys[i].toFixed(1)}" r="2.5" fill="${p.goal==='O'?'#16A34A':'#CBD5E1'}" stroke="white" stroke-width="1"><title>${fmt(p.date)}: ${p.reps} opak.</title></circle>`:'').join(''):'';

  const trend=pts[pts.length-1].v-pts[0].v;
  const trendTxt=trend>0?`▲ +${isPlank?fmtSecs(Math.round(trend)):Math.round(trend*10)/10}`:trend<0?`▼ ${isPlank?fmtSecs(Math.round(trend)):Math.round(trend*10)/10}`:'→ beze změny';
  const trendColor=trend>0?'#16A34A':trend<0?'#EA580C':'#64748B';

  return '<div id="mini-chart-'+t+'-0" style="background:var(--bg);border-top:1px solid var(--bd)">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 10px 2px">'
    +'<span style="font-size:9px;color:var(--t3)">'+pts.length+' sesí | <span style="color:'+color+'">— váha</span>'+(hasReps?' <span style="color:#94A3B8">-- opak.</span>':'')+'</span>'
    +'<span style="font-size:10px;font-weight:700;color:'+trendColor+'">'+trendTxt+'</span>'
    +'</div>'
    +'<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="height:'+H+'px;overflow:visible;display:block">'
    +'<defs><linearGradient id="mcg'+t+exName.length+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".15"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +yLbls
    +'<path d="'+wArea+'" fill="url(#mcg'+t+exName.length+')" />'
    +'<path d="'+wPath+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    +(hasReps&&rPath?'<path d="'+rPath+'" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2" stroke-linecap="round"/>':'')
    +wDots+rDots+xLbls
    +'</svg>'
    +'</div>';
}

function saveExNote(exName, t, i){
  const v = document.getElementById('ex-note-'+t+'-'+i)?.value||'';
  exNotes[exName] = v;
  SS('trn_ex_notes', exNotes);
}

function applyGoalHighlights(t){
  // Highlight previously set goals
  Object.keys(seriesGoals).forEach(key=>{
    if(!key.startsWith(t+'-')) return;
    const i=parseInt(key.split('-')[1]);
    const goal=seriesGoals[key];
    const btnV=document.getElementById('goal-V-'+t+'-'+i);
    const btnO=document.getElementById('goal-O-'+t+'-'+i);
    if(btnV) btnV.style.background = goal==='V'?'#FEE2E2':'var(--bg)';
    if(btnO) btnO.style.background = goal==='O'?'#DCFCE7':'var(--bg)';
  });
}

function getGoalFromHistory(exName, t){
  // Get the goal set in the most recent session for this exercise
  const sessions_t = histT(t);
  for(const s of sessions_t){
    if(s.goals && s.goals[exName]) return s.goals[exName];
  }
  return null;
}

function fmtWorkoutTime(secs){
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60;
  return h>0?h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s:m+':'+(s<10?'0':'')+s;
}

function toggleWorkoutTimer(t){
  if(workoutTimers[t]){
    // Stop — write elapsed minutes to input
    clearInterval(workoutTimers[t].interval);
    const mins = Math.ceil(workoutTimers[t].elapsed/60);
    const inp = document.getElementById('fd-dur-'+t);
    if(inp) inp.value = mins;
    delete workoutTimers[t];
    const btn=document.getElementById('wt-btn-'+t);
    const disp=document.getElementById('wt-display-'+t);
    if(btn){btn.textContent='🚀 Pojďme na to!';btn.style.background='linear-gradient(135deg,#7C3AED,#5B21B6)';}
    if(disp){disp.textContent=mins+' min';disp.style.color='var(--t)';}
  } else {
    // Start
    workoutTimers[t]={start:Date.now(),elapsed:0,interval:null};
    workoutTimers[t].interval=setInterval(()=>{
      workoutTimers[t].elapsed=Math.floor((Date.now()-workoutTimers[t].start)/1000);
      const disp=document.getElementById('wt-display-'+t);
      const btn=document.getElementById('wt-btn-'+t);
      if(disp){disp.textContent=fmtWorkoutTime(workoutTimers[t].elapsed);disp.style.color='#16A34A';}
      if(btn){btn.textContent='⏱ Běží';btn.style.background='#16A34A';}
    },1000);
    const btn=document.getElementById('wt-btn-'+t);
    if(btn){btn.textContent='⏱ Běží';btn.style.background='#16A34A';}
  }
}

  else if(cur==='F') document.getElementById('photo-upload').click();

(function migrate(){
  // If main key is empty, try known old keys from previous versions
  const oldKeys = ['sessions','trn_s3','trening_sessions','trn_sessions_v2'];
  const cur = LS('trn_sessions', []);
  if(!cur.length){
    for(const k of oldKeys){
      const v = LS(k, []);
      if(v.length){
        console.log('Migrating from key:', k, v.length, 'sessions');
        SS('trn_sessions', v);
        sessions = v;
        break;
      }
    }
  }
  // Also try backup
  if(!sessions.length){
    const bak = LS('bak_trn_sessions', []);
    if(bak.length){ sessions = bak; SS('trn_sessions', bak); }
  }
})();

<script>
if('serviceWorker' in navigator){
  // First unregister ALL old service workers to clear stale cache
  navigator.serviceWorker.getRegistrations().then(regs=>{
    const unregAll = regs.map(r=>r.unregister());
    return Promise.all(unregAll);
  }).then(()=>{
    // Clear all caches
    return caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
  }).then(()=>{
    // Re-register fresh SW
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
